name: legion-laravel
services:
  app:
    build:
      context: .
      target: app
    image: legion-laravel:local
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: ${DOCKER_APP_URL:-${APP_URL}}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-legion}
      DB_USERNAME: ${DB_USERNAME:-legion}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_COLLATION: utf8mb4_bin
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    volumes:
      - runtime:/var/www/html/storage
      - ./storage/app/migration:/var/www/html/storage/app/migration:ro
      - ./public/media:/var/www/html/public/media
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    image: legion-laravel-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8004}:80"
    volumes:
      - ./public/media:/var/www/html/public/media:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4.11}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-legion}
      MYSQL_USER: ${DB_USERNAME:-legion}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
  runtime:
